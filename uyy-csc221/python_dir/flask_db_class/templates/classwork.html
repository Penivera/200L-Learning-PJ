<!DOCTYPE html>
<html>

<head>
    <title>Form to do something</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .form-container {
            background: #fff;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 25px 20px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 6px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background:green;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 20px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Group 2 Form</h2>
        <form method="post" action="{{url_for('submit')}}">
            <label for="student_name">Student Name:</label><br>
            <input type="text" id="student_name" name="student_name" required><br>
            <label for="reg_no">Registration Number:</label><br>
            <input type="text" id="reg_no" name="reg_no" required><br>
            <label for="dept">Department:</label><br>
            <input type="text" id="dept" name="dept" required><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>
            <button type="submit">Signup</button>
        </form>
    </div>
</body>
